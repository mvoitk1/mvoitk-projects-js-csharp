stages:
  - deploy

deploy_javascript_a1:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - JS/assignment1/**/*
  tags:
    - shared
  script:
    - cd JS/assignment1
    - docker compose -p jsassignment1 up --build --remove-orphans --detach

deploy_javascript_a2:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - JS/assignment2/**/*
  tags:
    - shared
  script:
    - cd JS/assignment2
    - docker compose -p jsassignment2 up --build --remove-orphans --detach

deploy_csharp_a1:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - Csharp/Conference and Event Venue Platform SaaS v2/**/*
  tags:
    - shared
  script:
    - cd "Csharp/Conference and Event Venue Platform SaaS v2"
    - printf "APP_PORT=%s\nASPNETCORE_ENVIRONMENT=%s\nPOSTGRES_DB=%s\nPOSTGRES_USER=%s\nPOSTGRES_PASSWORD=%s\n" "${CSHARP_A1_APP_PORT:-81}" "${CSHARP_A1_ASPNETCORE_ENVIRONMENT:-Production}" "${CSHARP_A1_POSTGRES_DB:-csharp_madis}" "${CSHARP_A1_POSTGRES_USER:-madis}" "${CSHARP_A1_POSTGRES_PASSWORD}" > .env
    - docker compose -p csharp_a1 up --build --remove-orphans --detach

deploy_csharp_a3:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - Csharp/Assignment_3/**/*
  tags:
    - shared
  script:
    - cd "Csharp/Assignment_3"
    - test -n "$CSHARP_A3_POSTGRES_PASSWORD" || exit 1
    - test -n "$CSHARP_A3_JWT_KEY" || exit 1
    - printf "APP_PORT=%s\nASPNETCORE_ENVIRONMENT=%s\nPOSTGRES_DB=%s\nPOSTGRES_USER=%s\nPOSTGRES_PASSWORD=%s\nJWT_KEY=%s\nJWT_ISSUER=%s\nJWT_AUDIENCE=%s\n" "${CSHARP_A3_APP_PORT:-82}" "${CSHARP_A3_ASPNETCORE_ENVIRONMENT:-Production}" "${CSHARP_A3_POSTGRES_DB:-csharp_a3}" "${CSHARP_A3_POSTGRES_USER:-csharp_a3}" "${CSHARP_A3_POSTGRES_PASSWORD}" "${CSHARP_A3_JWT_KEY}" "${CSHARP_A3_JWT_ISSUER:-https://shop.local}" "${CSHARP_A3_JWT_AUDIENCE:-https://shop.local}" > .env
    - docker compose -p csharp_a3 up --build --remove-orphans --detach

deploy_javascript_a4:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - JS/assignment4/**/*
  tags:
    - shared
  script:
    - docker network create infra || true
    - cd JS/assignment4
    - docker compose -f docker-compose.production.yml -p jsassignment4 up --build --remove-orphans --detach

