stages:
  - deploy

deploy_javascript_a1:
  stage: deploy
  only:
    - main
  tags:
    - shared
  script:
    - cd JS/assignment1
    - docker compose -p jsassignment1 up --build --remove-orphans --detach

deploy_javascript_a2:
  stage: deploy
  only:
    - main
  tags:
    - shared
  script:
    - cd JS/assignment2
    - docker compose -p jsassignment2 up --build --remove-orphans --detach

deploy_csharp_a1:
  stage: deploy
  only:
    - main
  tags:
    - shared
  script:
    - cd "Csharp/Conference and Event Venue Platform SaaS v2"
    - printf "APP_PORT=%s\nASPNETCORE_ENVIRONMENT=%s\nPOSTGRES_DB=%s\nPOSTGRES_USER=%s\nPOSTGRES_PASSWORD=%s\n" "${CSHARP_A1_APP_PORT:-81}" "${CSHARP_A1_ASPNETCORE_ENVIRONMENT:-Production}" "${CSHARP_A1_POSTGRES_DB:-csharp_madis}" "${CSHARP_A1_POSTGRES_USER:-madis}" "${CSHARP_A1_POSTGRES_PASSWORD}" > .env
    - docker compose -p csharp_a1 up --build --remove-orphans --detach
