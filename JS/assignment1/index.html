<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager - GUI</title>
  <style>
    /* ===== CSS Variables ===== */
    :root {
      --bg-primary: #0f0f14;
      --bg-secondary: #18181f;
      --bg-tertiary: #22222b;
      --bg-elevated: #2a2a35;
      --text-primary: #f0f0f5;
      --text-secondary: #9090a0;
      --text-muted: #606070;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --accent-light: rgba(99, 102, 241, 0.15);
      --success: #22c55e;
      --success-bg: rgba(34, 197, 94, 0.15);
      --warning: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.15);
      --error: #ef4444;
      --error-bg: rgba(239, 68, 68, 0.15);
      --info: #3b82f6;
      --info-bg: rgba(59, 130, 246, 0.15);
      --border: #2e2e3a;
      --border-light: #3a3a48;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.4);
      --radius: 12px;
      --radius-sm: 8px;
      --radius-xs: 6px;
      --transition: all 0.2s ease;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* ===== Reset & Base ===== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow: hidden;
    }

    /* ===== Layout ===== */
    .app-container {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ===== Sidebar ===== */
    .sidebar {
      width: 260px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 24px;
      border-bottom: 1px solid var(--border);
    }

    .app-logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .app-logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .app-logo-text {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .sidebar-nav {
      flex: 1;
      padding: 16px 12px;
      overflow-y: auto;
    }

    .nav-section {
      margin-bottom: 24px;
    }

    .nav-section-title {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      padding: 0 12px;
      margin-bottom: 8px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition);
      color: var(--text-secondary);
      text-decoration: none;
      margin-bottom: 4px;
    }

    .nav-item:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .nav-item.active {
      background: var(--accent-light);
      color: var(--accent);
    }

    .nav-item-icon {
      font-size: 18px;
      width: 24px;
      text-align: center;
    }

    .nav-item-label {
      font-size: 0.9rem;
      font-weight: 500;
    }

    .nav-item-badge {
      margin-left: auto;
      background: var(--accent);
      color: white;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
    }

    .sidebar-footer {
      padding: 16px;
      border-top: 1px solid var(--border);
    }

    .add-task-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .add-task-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    /* ===== Main Content ===== */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ===== Header ===== */
    .main-header {
      padding: 20px 32px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .header-title {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 16px;
      min-width: 280px;
    }

    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 0.9rem;
      width: 100%;
    }

    .search-box input::placeholder {
      color: var(--text-muted);
    }

    .search-icon {
      color: var(--text-muted);
    }

    /* ===== Content Area ===== */
    .content-area {
      flex: 1;
      padding: 24px 32px;
      overflow-y: auto;
      background: var(--bg-primary);
    }

    /* ===== Views ===== */
    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    /* ===== Dashboard View ===== */
    .dashboard-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      transition: var(--transition);
    }

    .stat-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 16px;
    }

    .stat-icon.total { background: var(--accent-light); }
    .stat-icon.pending { background: var(--warning-bg); }
    .stat-icon.progress { background: var(--info-bg); }
    .stat-icon.completed { background: var(--success-bg); }

    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .stat-label {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .dashboard-sections {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 24px;
    }

    .dashboard-section {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .section-link {
      color: var(--accent);
      font-size: 0.85rem;
      cursor: pointer;
      transition: var(--transition);
    }

    .section-link:hover {
      color: var(--accent-hover);
    }

    /* ===== Task List View ===== */
    .task-list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .task-filters {
      display: flex;
      gap: 12px;
    }

    .filter-btn {
      padding: 8px 16px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-size: 0.85rem;
      cursor: pointer;
      transition: var(--transition);
    }

    .filter-btn:hover {
      border-color: var(--accent);
      color: var(--text-primary);
    }

    .filter-btn.active {
      background: var(--accent-light);
      border-color: var(--accent);
      color: var(--accent);
    }

    .tasks-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ===== Task Card ===== */
    .task-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: var(--transition);
      cursor: pointer;
    }

    .task-card:hover {
      border-color: var(--accent);
      transform: translateX(4px);
    }

    .task-card.priority-urgent {
      border-left: 4px solid var(--error);
    }

    .task-card.priority-high {
      border-left: 4px solid var(--warning);
    }

    .task-card.priority-medium {
      border-left: 4px solid var(--accent);
    }

    .task-card.priority-low {
      border-left: 4px solid var(--text-muted);
    }

    .task-checkbox {
      width: 22px;
      height: 22px;
      border: 2px solid var(--border-light);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      flex-shrink: 0;
    }

    .task-checkbox:hover {
      border-color: var(--accent);
    }

    .task-checkbox.checked {
      background: var(--success);
      border-color: var(--success);
    }

    .task-checkbox.checked::after {
      content: '✓';
      color: white;
      font-size: 12px;
    }

    .task-content {
      flex: 1;
      min-width: 0;
    }

    .task-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--text-primary);
    }

    .task-card.completed .task-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .task-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .task-tag {
      background: var(--bg-tertiary);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
    }

    .task-due-date {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .task-due-date.overdue {
      color: var(--error);
    }

    .task-due-date.today {
      color: var(--warning);
    }

    .task-actions {
      display: flex;
      gap: 8px;
      opacity: 0;
      transition: var(--transition);
    }

    .task-card:hover .task-actions {
      opacity: 1;
    }

    .task-action-btn {
      width: 32px;
      height: 32px;
      border: none;
      background: var(--bg-tertiary);
      border-radius: var(--radius-xs);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .task-action-btn:hover {
      background: var(--accent);
      color: white;
    }

    .task-action-btn.delete:hover {
      background: var(--error);
    }

    /* ===== Priority Badge ===== */
    .priority-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .priority-badge.urgent {
      background: var(--error-bg);
      color: var(--error);
    }

    .priority-badge.high {
      background: var(--warning-bg);
      color: var(--warning);
    }

    .priority-badge.medium {
      background: var(--accent-light);
      color: var(--accent);
    }

    .priority-badge.low {
      background: var(--bg-tertiary);
      color: var(--text-muted);
    }

    /* ===== Status Badge ===== */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .status-badge.pending {
      background: var(--warning-bg);
      color: var(--warning);
    }

    .status-badge.in-progress {
      background: var(--info-bg);
      color: var(--info);
    }

    .status-badge.completed {
      background: var(--success-bg);
      color: var(--success);
    }

    .status-badge.cancelled {
      background: var(--bg-tertiary);
      color: var(--text-muted);
    }

    /* ===== Calendar View ===== */
    .calendar-container {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .calendar-nav {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .calendar-nav-btn {
      width: 36px;
      height: 36px;
      border: 1px solid var(--border);
      background: var(--bg-tertiary);
      border-radius: var(--radius-xs);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .calendar-nav-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .calendar-month {
      font-size: 1.25rem;
      font-weight: 600;
      min-width: 180px;
      text-align: center;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }

    .calendar-day-header {
      text-align: center;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      padding: 8px;
      text-transform: uppercase;
    }

    .calendar-day {
      min-height: 80px;
      padding: 8px;
      background: var(--bg-tertiary);
      border-radius: var(--radius-xs);
      border: 1px solid transparent;
      transition: var(--transition);
    }

    .calendar-day:hover {
      border-color: var(--accent);
    }

    .calendar-day.other-month {
      opacity: 0.4;
    }

    .calendar-day.today {
      border-color: var(--accent);
      background: var(--accent-light);
    }

    .calendar-day-number {
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .calendar-tasks {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .calendar-task-dot {
      width: 100%;
      padding: 2px 6px;
      background: var(--accent);
      border-radius: 4px;
      font-size: 0.7rem;
      color: white;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }

    .calendar-task-dot.priority-urgent { background: var(--error); }
    .calendar-task-dot.priority-high { background: var(--warning); }
    .calendar-task-dot.priority-medium { background: var(--accent); }
    .calendar-task-dot.priority-low { background: var(--text-muted); }

    /* ===== Task Detail Modal ===== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: var(--transition);
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 90%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      transform: scale(0.9);
      transition: var(--transition);
    }

    .modal-overlay.active .modal {
      transform: scale(1);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
    }

    .modal-title {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .modal-close {
      width: 36px;
      height: 36px;
      border: none;
      background: var(--bg-tertiary);
      border-radius: var(--radius-xs);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .modal-close:hover {
      background: var(--error);
      color: white;
    }

    .modal-body {
      padding: 24px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .form-input,
    .form-select,
    .form-textarea {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 0.95rem;
      transition: var(--transition);
    }

    .form-input:focus,
    .form-select:focus,
    .form-textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .form-textarea {
      min-height: 120px;
      resize: vertical;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .tags-input-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px 12px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      min-height: 48px;
    }

    .tags-input-container:focus-within {
      border-color: var(--accent);
    }

    .tag-item {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      background: var(--accent-light);
      border-radius: 20px;
      font-size: 0.85rem;
      color: var(--accent);
    }

    .tag-remove {
      cursor: pointer;
      opacity: 0.7;
    }

    .tag-remove:hover {
      opacity: 1;
    }

    .tags-input {
      flex: 1;
      min-width: 100px;
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-size: 0.95rem;
      outline: none;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      padding: 16px 24px;
      border-top: 1px solid var(--border);
    }

    .btn {
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      border: none;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: var(--bg-tertiary);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      border-color: var(--accent);
      color: var(--text-primary);
    }

    .btn-danger {
      background: var(--error);
      color: white;
    }

    .btn-danger:hover {
      background: #dc2626;
    }

    /* ===== Empty State ===== */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
    }

    .empty-state-icon {
      font-size: 64px;
      margin-bottom: 20px;
      opacity: 0.5;
    }

    .empty-state-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .empty-state-text {
      color: var(--text-secondary);
      margin-bottom: 24px;
    }

    /* ===== Scrollbar ===== */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-primary);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    /* ===== Responsive ===== */
    @media (max-width: 1024px) {
      .dashboard-stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .dashboard-sections {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        left: -260px;
        height: 100%;
        z-index: 100;
        transition: var(--transition);
      }

      .sidebar.open {
        left: 0;
      }

      .main-header {
        padding: 16px;
      }

      .content-area {
        padding: 16px;
      }

      .search-box {
        display: none;
      }

      .dashboard-stats {
        grid-template-columns: 1fr;
      }

      .form-row {
        grid-template-columns: 1fr;
      }
    }

    /* ===== Animations ===== */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .task-card {
      animation: fadeIn 0.3s ease forwards;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="app-logo">
          <div class="app-logo-icon">✓</div>
          <span class="app-logo-text">TaskFlow</span>
        </div>
      </div>
      
      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">Menu</div>
          <a class="nav-item active" data-view="dashboard">
            <span class="nav-item-icon">📊</span>
            <span class="nav-item-label">Dashboard</span>
            <span class="nav-item-badge" id="total-badge">0</span>
          </a>
          <a class="nav-item" data-view="tasks">
            <span class="nav-item-icon">📋</span>
            <span class="nav-item-label">All Tasks</span>
          </a>
          <a class="nav-item" data-view="calendar">
            <span class="nav-item-icon">📅</span>
            <span class="nav-item-label">Calendar</span>
          </a>
        </div>
        
        <div class="nav-section">
          <div class="nav-section-title">Quick Filters</div>
          <a class="nav-item filter-nav" data-filter="pending">
            <span class="nav-item-icon">⏳</span>
            <span class="nav-item-label">Pending</span>
            <span class="nav-item-badge" id="pending-badge">0</span>
          </a>
          <a class="nav-item filter-nav" data-filter="in-progress">
            <span class="nav-item-icon">🔄</span>
            <span class="nav-item-label">In Progress</span>
            <span class="nav-item-badge" id="progress-badge">0</span>
          </a>
          <a class="nav-item filter-nav" data-filter="completed">
            <span class="nav-item-icon">✅</span>
            <span class="nav-item-label">Completed</span>
            <span class="nav-item-badge" id="completed-badge">0</span>
          </a>
        </div>
      </nav>
      
      <div class="sidebar-footer">
        <button class="add-task-btn" id="add-task-btn">
          <span>+</span>
          <span>New Task</span>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Header -->
      <header class="main-header">
        <h1 class="header-title" id="header-title">Dashboard</h1>
        <div class="header-actions">
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" placeholder="Search tasks...">
          </div>
        </div>
      </header>

      <!-- Content Area -->
      <div class="content-area">
        <!-- Dashboard View -->
        <div class="view active" id="dashboard-view">
          <div class="dashboard-stats">
            <div class="stat-card">
              <div class="stat-icon total">📋</div>
              <div class="stat-value" id="stat-total">0</div>
              <div class="stat-label">Total Tasks</div>
            </div>
            <div class="stat-card">
              <div class="stat-icon pending">⏳</div>
              <div class="stat-value" id="stat-pending">0</div>
              <div class="stat-label">Pending</div>
            </div>
            <div class="stat-card">
              <div class="stat-icon progress">🔄</div>
              <div class="stat-value" id="stat-progress">0</div>
              <div class="stat-label">In Progress</div>
            </div>
            <div class="stat-card">
              <div class="stat-icon completed">✅</div>
              <div class="stat-value" id="stat-completed">0</div>
              <div class="stat-label">Completed</div>
            </div>
          </div>
          
          <div class="dashboard-sections">
            <div class="dashboard-section">
              <div class="section-header">
                <h3 class="section-title">Recent Tasks</h3>
                <span class="section-link" data-view="tasks">View All →</span>
              </div>
              <div class="tasks-container" id="recent-tasks"></div>
            </div>
            
            <div class="dashboard-section">
              <div class="section-header">
                <h3 class="section-title">Upcoming Deadlines</h3>
              </div>
              <div class="tasks-container" id="upcoming-tasks"></div>
            </div>
          </div>
        </div>

        <!-- Tasks View -->
        <div class="view" id="tasks-view">
          <div class="task-list-header">
            <div class="task-filters">
              <button class="filter-btn active" data-status="all">All</button>
              <button class="filter-btn" data-status="pending">Pending</button>
              <button class="filter-btn" data-status="in-progress">In Progress</button>
              <button class="filter-btn" data-status="completed">Completed</button>
            </div>
          </div>
          
          <div class="tasks-container" id="all-tasks"></div>
        </div>

        <!-- Calendar View -->
        <div class="view" id="calendar-view">
          <div class="calendar-container">
            <div class="calendar-header">
              <div class="calendar-nav">
                <button class="calendar-nav-btn" id="prev-month">←</button>
                <span class="calendar-month" id="calendar-month">January 2026</span>
                <button class="calendar-nav-btn" id="next-month">→</button>
              </div>
              <button class="btn btn-secondary" id="today-btn">Today</button>
            </div>
            <div class="calendar-grid" id="calendar-grid"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Task Modal -->
  <div class="modal-overlay" id="task-modal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title">New Task</h2>
        <button class="modal-close" id="modal-close">×</button>
      </div>
      <div class="modal-body">
        <form id="task-form">
          <input type="hidden" id="task-id">
          
          <div class="form-group">
            <label class="form-label">Title *</label>
            <input type="text" class="form-input" id="task-title" placeholder="Enter task title" required>
          </div>
          
          <div class="form-group">
            <label class="form-label">Description</label>
            <textarea class="form-textarea" id="task-description" placeholder="Enter task description (optional)"></textarea>
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Status</label>
              <select class="form-select" id="task-status">
                <option value="pending">Pending</option>
                <option value="in-progress">In Progress</option>
                <option value="completed">Completed</option>
                <option value="cancelled">Cancelled</option>
              </select>
            </div>
            
            <div class="form-group">
              <label class="form-label">Priority</label>
              <select class="form-select" id="task-priority">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
                <option value="urgent">Urgent</option>
              </select>
            </div>
          </div>
          
          <div class="form-group">
            <label class="form-label">Due Date</label>
            <input type="date" class="form-input" id="task-due-date">
          </div>
          
          <div class="form-group">
            <label class="form-label">Tags</label>
            <div class="tags-input-container" id="tags-container">
              <input type="text" class="tags-input" id="tags-input" placeholder="Add tags (press Enter)">
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-danger" id="delete-task-btn" style="display: none;">Delete</button>
        <button class="btn btn-secondary" id="cancel-btn">Cancel</button>
        <button class="btn btn-primary" id="save-task-btn">Save Task</button>
      </div>
    </div>
  </div>

  <!-- Load JavaScript Modules -->
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/validator.js"></script>
  <script src="js/formatters.js"></script>
  <script src="js/taskManager.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
